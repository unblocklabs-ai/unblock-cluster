name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        id: python-314
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Fall back to Python 3.12
        if: steps.python-314.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Note Python fallback
        if: steps.python-314.outcome == 'failure'
        run: echo "::warning::Python 3.14 was unavailable on this runner; CI fell back to 3.12."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Assert OpenAI key is not configured
        run: test -z "${OPENAI_API_KEY:-}"

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Pytest
        run: .venv/bin/python -m pytest

      - name: Node tests
        run: node --test tests/*.test.mjs

      - name: Knip
        run: npx knip

      - name: Build frontend
        run: npm run build
