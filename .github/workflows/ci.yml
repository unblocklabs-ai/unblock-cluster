name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        id: python-314
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Fall back to Python 3.12
        if: steps.python-314.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Note Python fallback
        if: steps.python-314.outcome == 'failure'
        run: echo "::warning::Python 3.14 was unavailable on this runner; CI fell back to 3.12."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Assert OpenAI key is not configured
        run: test -z "${OPENAI_API_KEY:-}"

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Pytest
        run: .venv/bin/python -m pytest -n auto

      - name: Node tests
        run: node --test tests/*.test.mjs

      - name: Knip
        run: npx knip

      - name: Build frontend
        run: npm run build
