<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Graph</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Data Graph</h1>
          <p id="viewSubtitle"></p>
        </div>
        <div class="toolbar">
          <label>
            <span>Search</span>
            <input id="recordSearch" type="search" autocomplete="off" />
          </label>
          <label>
            <span>Topic</span>
            <select id="topicFilter"></select>
          </label>
          <label>
            <span>Source</span>
            <select id="sourceTypeFilter"></select>
          </label>
          <label>
            <span>Start</span>
            <input id="startDate" type="date" />
          </label>
          <label>
            <span>End</span>
            <input id="endDate" type="date" />
          </label>
        </div>
        <div class="stats" id="stats"></div>
      </header>

      <main class="workspace">
        <aside class="topic-panel" id="topicPanel" aria-label="Topics"></aside>

        <section class="stage">
          <div class="modebar">
            <button id="mapModeButton" type="button">Map</button>
            <button id="listModeButton" type="button">List</button>
            <button id="fitAllButton" type="button">Fit</button>
            <button id="clearTopicButton" type="button">Clear Topic</button>
          </div>
          <section class="map-shell" id="mapShell" aria-label="Topic map">
            <div id="mapCanvas"></div>
          </section>
          <section class="list-shell" id="listShell" aria-label="Record list" hidden>
            <div id="listContent"></div>
          </section>
          <section class="picker" id="picker" hidden></section>
        </section>

        <aside class="inspector" aria-label="Topic evidence">
          <div class="empty-state" id="emptyState">
            <strong>Select a topic</strong>
            <p>Representative records, source mix, labels, and trend context appear here.</p>
          </div>
          <div class="details" id="details" hidden></div>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
