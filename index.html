<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Graph</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Data Graph</h1>
          <p id="viewSubtitle"></p>
        </div>
        <div class="toolbar">
          <label>
            <span>Search</span>
            <input id="recordSearch" type="search" autocomplete="off" />
          </label>
          <label>
            <span>Topic</span>
            <select id="topicFilter"></select>
          </label>
          <label>
            <span>Source</span>
            <select id="sourceTypeFilter"></select>
          </label>
          <label>
            <span>Start</span>
            <input id="startDate" type="date" />
          </label>
          <label>
            <span>End</span>
            <input id="endDate" type="date" />
          </label>
          <div class="date-presets" role="group" aria-label="Date range presets">
            <button type="button" data-date-preset="7d" aria-label="Show last 7 days">7d</button>
            <button type="button" data-date-preset="30d" aria-label="Show last 30 days">30d</button>
            <button type="button" data-date-preset="90d" aria-label="Show last 90 days">90d</button>
            <button type="button" data-date-preset="all" aria-label="Show all dates">All</button>
          </div>
        </div>
        <div class="stats" id="stats"></div>
      </header>

      <section class="warnings-banner" id="warningsBanner" hidden></section>
      <section class="picker" id="picker" hidden></section>

      <main class="workspace" id="workspace">
        <aside class="topic-panel" id="topicPanel" aria-label="Topics">
          <div class="topic-panel-controls">
            <label>
              <span>Topic search</span>
              <input id="topicSearch" type="search" autocomplete="off" aria-label="Search topics" />
            </label>
            <label>
              <span>Sort</span>
              <select id="topicSort" aria-label="Sort topics">
                <option value="size">Size</option>
                <option value="spike">Spike</option>
                <option value="name">Name</option>
              </select>
            </label>
          </div>
          <div id="topicList"></div>
          <footer class="provenance" id="provenance"></footer>
        </aside>

        <section class="stage">
          <div class="modebar">
            <div class="segmented-control" role="group" aria-label="View mode">
              <button id="mapModeButton" type="button" aria-pressed="true">Map</button>
              <button id="listModeButton" type="button" aria-pressed="false">List</button>
            </div>
            <div class="map-actions" role="group" aria-label="Map actions">
              <button id="fitAllButton" type="button">Fit</button>
            </div>
            <div class="selection-actions" role="group" aria-label="Selection actions">
              <button id="clearTopicButton" type="button" hidden>Clear Topic</button>
            </div>
          </div>
          <section class="map-shell" id="mapShell" aria-label="Topic map">
            <div id="mapCanvas"></div>
          </section>
          <section class="list-shell" id="listShell" aria-label="Record list" hidden>
            <div id="listContent"></div>
          </section>
        </section>

        <aside class="inspector" aria-label="Topic evidence">
          <div class="empty-state" id="emptyState">
            <strong>Select a topic</strong>
            <p>Representative records, source mix, labels, and trend context appear here.</p>
          </div>
          <div class="details" id="details" hidden></div>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
